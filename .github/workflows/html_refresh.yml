name: NSE Expert HTML — 8 AM Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "00 08 * * 1-5"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: nse-html-refresh
  cancel-in-progress: false

jobs:
  refresh_html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate latest data and refresh Expert HTML
        run: python refresh_expert_html.py

      - name: Commit refreshed HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/NSE_All_Share_Institutional_Terminal.html
          git diff --cached --quiet || git commit -m "Refresh NSE expert HTML dashboard"
          git push
