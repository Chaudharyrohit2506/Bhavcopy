name: NSE Daily Market Intelligence — Data Refresh

on:
  workflow_dispatch:
  schedule:
   - cron: "0 19 * * 0-4"

permissions:
  contents: write

concurrency:
  group: nse-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download NSE 50 sessions
        run: python download_nse_50_sessions.py

      - name: Calculate market intelligence
        run: python calculate_market_intelligence.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Refresh NSE market intelligence data"
          git push
