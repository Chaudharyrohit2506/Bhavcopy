name: NSE Daily Market Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "45 14 * * 1-5"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download NSE 50 sessions
        run: python download_nse_50_sessions.py

      - name: Calculate market intelligence
        run: python calculate_market_intelligence.py

      - name: Generate dashboard
        run: python generate_dashboard.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data output
          git diff --cached --quiet || git commit -m "Refresh NSE market intelligence"
          git push
